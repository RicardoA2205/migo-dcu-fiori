# Ayuda de cada pantalla (EH-22). Redactada con los textos de la guía y los criterios de las HU; validar con el especialista en HCI
ayudaTitulo=Ayuda
ayudaInicio=Elija la tarea en su mosaico:\n• Registrar entrada por compras: recepción con orden de compra (movimiento 101).\n• Registrar salida por producción: entrega de componentes a una orden (movimiento 261).
ayudaEntradaOrden=Ingrese el número de la orden de compra que figura en la guía de remisión del proveedor y pulse Buscar.\nRevise el proveedor y la fecha de la orden antes de pulsar Continuar. Si el número no existe, corríjalo y vuelva a buscar.
ayudaEntradaRegistro=1. Complete la fecha de documento, la fecha de contabilización y la guía de remisión (formato {0}).\n2. En la tabla, revise la cantidad recibida y el almacén de cada posición. Use el buscador para encontrar una posición.\n3. Seleccione las posiciones y pulse Marcar como conformes o Excluir del registro.\n4. Pulse Verificar para revisar los datos. Cada mensaje dice qué corregir y, al pulsarlo, lleva al campo.\n5. Pulse Contabilizar para ver el resumen antes de registrar.
ayudaResultado=El número de documento de material identifica el registro. Use Copiar número para guardarlo.
ayudaSalidaOrden=Ingrese el número de la orden de producción y pulse Buscar.\nSolo puede continuar si la orden está liberada. Si no lo está, sus componentes no se cargan: solicite su liberación al responsable de planificación.
ayudaSalidaRegistro=1. Complete la fecha de documento y la fecha de contabilización.\n2. En la tabla, revise el stock disponible y el almacén de origen de cada componente; puede editar la cantidad a entregar, el almacén y el lote.\n3. Si falta stock, pulse el aviso de la fila para ver las alternativas.\n4. Use Agregar componente no planificado para un material que no está en la orden.\n5. Pulse Verificar para revisar los datos y Contabilizar para ver el resumen antes de registrar.
